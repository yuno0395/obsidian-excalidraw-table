# main に push すると、manifest.json の version（例：0.1.0）の Releases がまだなければ、
# main.js をビルドして Releases を作り、main.js と manifest.json を置く（タグも GitHub が作る）。
# すでにその版の Releases があれば何もしない。版を上げる時は manifest.json・package.json・versions.json の version を上げて push する。
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: v
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v=$(node -p "require('./manifest.json').version")
          # only a plain version number (it is used as a tag name and in commands below)
          if ! printf '%s' "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then echo "bad version: $v"; exit 1; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if gh release view "$v" >/dev/null 2>&1; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        if: steps.v.outputs.exists == 'false'
        with:
          node-version: "20"
      - name: Build
        if: steps.v.outputs.exists == 'false'
        run: |
          npm ci
          npm run build
      - name: Create release
        if: steps.v.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          gh release create "$VERSION" main.js manifest.json \
            --target "${GITHUB_SHA}" --title "$VERSION" --generate-notes
